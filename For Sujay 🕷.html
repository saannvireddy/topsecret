<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Sujay 🕷️</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--red:#e0202f;--blue:#1d4ed8;--gold:#ffd23f;--ink:#050818;--paper:#fff7df;color-scheme:dark;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'Caveat','Comic Sans MS',cursive;color:#fff;-webkit-tap-highlight-color:transparent}
.scene{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px);overflow:auto}
.scene.on{display:flex}
.night{background:radial-gradient(2px 2px at 12% 18%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 10%,#fff,transparent),radial-gradient(2px 2px at 85% 38%,#fff9,transparent),radial-gradient(1.5px 1.5px at 30% 55%,#fff8,transparent),radial-gradient(1.5px 1.5px at 55% 30%,#fff,transparent),linear-gradient(#050818,#12195a 85%,#2a1050)}
.h{font-family:'Bangers',Impact,sans-serif;letter-spacing:.04em}
.btn{font:inherit;font-family:'Bangers',Impact,sans-serif;letter-spacing:.05em;font-size:1.6rem;background:var(--gold);color:#111;border:3px solid #000;border-radius:12px;padding:10px 22px;box-shadow:4px 4px 0 var(--red);cursor:pointer;animation:glow 1.6s ease-in-out infinite}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--red)}
@keyframes glow{50%{filter:drop-shadow(0 0 12px var(--gold))}}
#webs svg{position:fixed;width:min(38vmin,170px);height:auto;pointer-events:none;z-index:3}
#emb{cursor:pointer;background:none;border:0;filter:drop-shadow(0 0 28px var(--red))}
#emb svg{width:min(70vw,300px);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.09)}}
.tg{stroke:#fff;stroke-width:4;stroke-linecap:round;animation:tg .7s steps(2) infinite}
@keyframes tg{0%{opacity:.1}50%{opacity:1}}
#burst{position:fixed;inset:0;z-index:20;display:none;background:radial-gradient(circle,#fff 0,var(--red) 22%,var(--blue) 60%,var(--ink));pointer-events:none}
#burst.on{display:block;animation:bf 1.25s forwards}
@keyframes bf{0%{opacity:0}15%{opacity:1}65%{opacity:1}100%{opacity:0}}
#burst svg{position:absolute;inset:0;width:100%;height:100%}
#burst line{stroke:#fff;stroke-width:.7;stroke-dasharray:130;stroke-dashoffset:130;animation:dr .5s .05s forwards}
#burst circle{fill:none;stroke:#fff;stroke-width:.6;opacity:0;animation:ri .5s .3s forwards}
@keyframes dr{to{stroke-dashoffset:0}}@keyframes ri{to{opacity:1}}
#burst b{position:absolute;left:50%;top:50%;font:900 min(24vw,150px) 'Bangers',Impact;color:var(--gold);-webkit-text-stroke:3px #000;transform:translate(-50%,-50%) rotate(-8deg);animation:sl .4s .2s both}
@keyframes sl{from{transform:translate(-50%,-50%) rotate(-8deg) scale(3);opacity:0}}
#s1{background:radial-gradient(#fff3 1.5px,transparent 2px) 0 0/16px 16px,linear-gradient(135deg,#d11a2a 0 50%,#1b3fbf 50%);text-align:center;gap:6px}
#s1 .c{font-size:clamp(2rem,10.5vw,4.4rem);color:#fff;-webkit-text-stroke:2px #000;text-shadow:4px 4px 0 #000}
#s1 .n{font-size:clamp(4rem,24vw,10rem);line-height:.95;color:var(--gold);-webkit-text-stroke:4px #000;text-shadow:6px 6px 0 #000}
.on .slam{animation:slam .65s cubic-bezier(.2,1.6,.4,1) both}.on .d2{animation-delay:.35s}
@keyframes slam{from{transform:scale(3.2) rotate(-6deg);opacity:0}}
.st{position:absolute;display:grid;place-items:center;font:2rem 'Bangers',Impact;color:#c1121f;background:var(--gold);width:110px;height:110px;-webkit-text-stroke:0;filter:drop-shadow(3px 3px 0 #000)}
.cf{position:fixed;top:-20px;width:9px;height:14px;z-index:2;animation:fall linear infinite;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(720deg)}}
#s1 .btn{margin-top:28px;position:relative;z-index:4}
#city{position:absolute;inset:0;width:100%;height:100%}
#s2 .btn{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 28px);z-index:4}
#s3{padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
#card{position:relative;background:var(--paper);color:#1a1a2e;border:4px solid #000;border-radius:22px;box-shadow:7px 7px 0 var(--red);padding:18px 20px;width:min(92vw,520px);max-height:68vh;overflow:auto;animation:pop .55s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.3) rotate(-6deg);opacity:0}}
#card h2{font-family:'Bangers',Impact;color:var(--red);font-size:1.7rem;font-weight:400;letter-spacing:.04em;margin-bottom:8px;-webkit-text-stroke:.5px #000}
#msgtxt{white-space:pre-wrap;font-size:1.45rem;line-height:1.3}
#next3{margin-top:22px;opacity:0;pointer-events:none;transition:opacity .5s}#next3.show{opacity:1;pointer-events:auto}
#s4{justify-content:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 26px)}
.strand{width:2px;height:48px;background:#fffc;position:relative}.strand:before{content:"";position:absolute;bottom:-3px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--red);border:2px solid #fff}
.pol{background:#fffdf7;padding:12px 12px 8px;width:min(72vw,290px);transform:rotate(-4deg);box-shadow:0 12px 30px #000a;color:#222;transform-origin:50% 0;animation:sw 4s ease-in-out infinite}
@keyframes sw{50%{transform:rotate(-1.5deg)}}
.pol img{display:block;width:100%;aspect-ratio:1/1.15;object-fit:cover;object-position:60% 40%;background:#ccc}
.pol p{font-size:1.55rem;line-height:1.05;text-align:center;padding:10px 4px 4px}
.wrap{position:relative}
#bq{position:absolute;right:-70px;bottom:-130px;width:140px;transform-origin:50% 100%;animation:sway 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 10px #0008)}
@keyframes sway{50%{transform:rotate(4deg)}}
#bq .sp{animation:bob 2.4s ease-in-out infinite}@keyframes bob{50%{transform:translateY(8px)}}
.end{margin-top:150px;text-align:center;font-size:1.6rem;line-height:1.2;padding-bottom:20px}
.end .h{font-size:2rem;color:var(--gold);-webkit-text-stroke:1px #000}
.pt{position:fixed;top:-20px;width:10px;height:14px;border-radius:50% 0;z-index:2;pointer-events:none;animation:fall linear forwards}
.tr{position:fixed;width:7px;height:7px;border-radius:50%;background:#fff;z-index:30;pointer-events:none;animation:fo .7s forwards}
@keyframes fo{to{opacity:0;transform:scale(.2)}}
.crawl{position:fixed;bottom:4px;left:-30px;font-size:18px;z-index:5;pointer-events:none;animation:cr 16s linear infinite}
@keyframes cr{to{transform:translateX(calc(100vw + 60px))}}
.hr{position:fixed;bottom:-40px;z-index:6;pointer-events:none;animation:rise linear forwards}
@keyframes rise{0%{opacity:0;transform:translateY(0) scale(.6)}15%{opacity:.9}100%{opacity:0;transform:translateY(-112vh) translateX(var(--dx)) scale(1.15)}}
.hs{position:absolute;z-index:1;pointer-events:none;font-style:normal;filter:drop-shadow(0 0 2px #fff8);animation:beat 2.2s ease-in-out infinite}
@keyframes beat{50%{transform:scale(1.2)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style></head><body>

<line class="tg" x1="202" y1="46" x2="222" y2="26"/><line class="tg" x1="212" y1="72" x2="234" y2="64" style="animation-delay:.2s"/><line class="tg" x1="176" y1="28" x2="184" y2="6" style="animation-delay:.35s"/></g>

<script>
const $=s=>document.querySelector(s),R=Math.random;
const MSG=`omggg im genuinely so sooo happy for youu like this is such a big achievement i really hope your giving yourself the credit you deserve for it its sooo nice seeing good things happen to you and i hope this is just the beginning of many things you’ll get to celebratee I genuinely wish i could make you see yourself the way i see you like this is so respectable and you’re capable of so much more asalu i hope wherever you go you get to make new memories and do things you’ve always dreamed of and i reallyyy pray that life keeps giving you reasons to be proud of yourself so so soooo happy and sooo proud of youuu congratulations againnnn 🙆🏻‍♀️🙆🏻‍♀️`;
// corner webs
(function(){const P=[];for(let k=0;k<5;k++){const a=k*Math.PI/8;P.push([Math.cos(a),Math.sin(a)])}
let d='';P.forEach(p=>d+=`M0 0L${p[0]*100} ${p[1]*100}`);[26,50,76,100].forEach(r=>{d+='M'+P.map(p=>`${p[0]*r} ${p[1]*r}`).join('L')});
const s=`<svg viewBox="-2 -2 104 104"><path d="${d}" stroke="#fff" fill="none" opacity=".32" stroke-width=".9"/></svg>`,w=$('#webs');
[['top:0;left:0',''],['top:0;right:0','scaleX(-1)'],['bottom:0;left:0','scaleY(-1)'],['bottom:0;right:0','scale(-1,-1)']].forEach(c=>{const e=document.createElement('div');e.innerHTML=s;const v=e.firstChild;v.style.cssText=c[0]+';transform:'+c[1];w.appendChild(v)})})();
// burst
(function(){let h='';for(let i=0;i<16;i++){const a=i*Math.PI/8;h+=`<line x1="50" y1="50" x2="${50+120*Math.cos(a)}" y2="${50+120*Math.sin(a)}"/>`}[9,20,34,50].forEach(r=>h+=`<circle cx="50" cy="50" r="${r}"/>`);$('#bsv').innerHTML=h})();
// starbursts
document.querySelectorAll('.st').forEach(e=>{let p=[];for(let i=0;i<24;i++){const a=i*Math.PI/12,r=i%2?38:50;p.push(`${50+r*Math.cos(a)}% ${50+r*Math.sin(a)}%`)}e.style.clipPath=`polygon(${p})`});
function go(n){document.querySelectorAll('.scene').forEach((e,i)=>e.classList.toggle('on',i===n));({1:confetti,2:city,3:type,4:petals})[n]?.()}
function burst(cb){const b=$('#burst');b.classList.add('on');setTimeout(cb,750);setTimeout(()=>b.classList.remove('on'),1250)}
$('#emb').onclick=()=>burst(()=>go(1));$('#b1').onclick=()=>go(2);$('#b2').onclick=()=>go(3);$('#next3').onclick=()=>go(4);
let cf=0;function confetti(){if(cf++)return;const c=['#e0202f','#2f5bff','#ffd23f','#fff'];for(let i=0;i<46;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${R()*100}%;background:${c[i%4]};animation-duration:${3+R()*4}s;animation-delay:${-R()*6}s`;$('#s1').appendChild(e)}}
// city + swinging spidey
let run=0;function city(){const W=innerWidth,H=innerHeight,s=$('#city');s.setAttribute('viewBox',`0 0 ${W} ${H}`);let h=`<circle cx="${W*.8}" cy="${H*.12}" r="${Math.min(W,H)*.06}" fill="#fff6c8" opacity=".9"/>`;
[['#0d1235',.2,.46],['#171e55',.12,.34]].forEach(([f,lo,rg])=>{for(let x=-10;x<W;){const w=40+R()*60,bh=H*(lo+R()*rg*.6);h+=`<rect x="${x}" y="${H-bh}" width="${w}" height="${bh}" fill="${f}"/>`;for(let wy=H-bh+12;wy<H-10;wy+=20)for(let wx=x+8;wx<x+w-10;wx+=16)if(R()<.3)h+=`<rect x="${wx}" y="${wy}" width="6" height="9" fill="#ffd23f" opacity=".8"/>`;x+=w+4}});
h+=`<line id="rp" stroke="#fff" stroke-width="2"/><circle id="an" r="4" fill="#fff"/><g id="sm"><g stroke-linecap="round" fill="none" stroke-width="6"><path d="M-6 8L-14 26M6 8L12 24" stroke="#1d4ed8"/><path d="M-14 26l-4 6M12 24l4 6" stroke="#e0202f"/><path d="M-7-12L-4-34M7-12L4-34" stroke="#e0202f"/></g><path d="M-9-14h18l-3 24h-12z" fill="#e0202f"/><path d="M-6 10h12l1 4h-14z" fill="#1d4ed8"/><path d="M0-12V8M-6-6Q0-3 6-6M-5 2Q0 5 5 2" stroke="#000" stroke-width=".8" fill="none"/><ellipse cy="-22" rx="9" ry="10" fill="#e0202f"/><path d="M-7-24l6 3-1 4zM7-24l-6 3 1 4z" fill="#fff" stroke="#000" stroke-width="1"/><path d="M0-32v6M-6-28l4 3M6-28l-4 3" stroke="#000" stroke-width=".7"/></g>`;
s.innerHTML=h;const L=Math.min(H*.34,W*.45),a=.75,S=2*L*Math.sin(a),T=1.4,ay=H*.14,M=Math.ceil((W+3*S)/S),hh=48,g=$('#sm'),rp=$('#rp'),an=$('#an'),t0=performance.now();run++;const my=run;
(function f(t){if(my!==run||!$('#s2').classList.contains('on'))return;const e=(t-t0)/1000/T+2.2,k=Math.floor(e),u=e-k,th=-a*Math.cos(Math.PI*u),ax=-S+(k%M)*S,sn=Math.sin(th),cs=Math.cos(th),x=ax+(L+hh)*sn,y=ay+(L+hh)*cs;
g.setAttribute('transform',`translate(${x} ${y}) rotate(${-th*57.3}) scale(1.25)`);rp.setAttribute('x1',ax);rp.setAttribute('y1',ay);rp.setAttribute('x2',ax+L*sn);rp.setAttribute('y2',ay+L*cs);an.setAttribute('cx',ax);an.setAttribute('cy',ay);requestAnimationFrame(f)})(t0)}
// message
let typed=0;function type(){if(typed++)return;const el=$('#msgtxt'),ch=Array.from(MSG);let i=0;el.textContent=MSG;$('#next3').classList.add('show')}
// petals
let pt=0;function petals(){if(pt++)return;const c=['#e0202f','#2f5bff','#fff'];setInterval(()=>{if(!$('#s4').classList.contains('on'))return;const e=document.createElement('i');e.className='pt';e.style.cssText=`left:${R()*100}%;background:${c[R()*3|0]};animation-duration:${5+R()*4}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),9500)},450)}
// floating hearts, every scene
const HS=['❤️','💖','💗','💕','🩷'];function heart(){const e=document.createElement('i');e.className='hr';e.textContent=HS[R()*5|0];e.style.cssText=`left:${R()*96}%;font-size:${14+R()*22}px;--dx:${(R()-.5)*80}px;animation-duration:${5+R()*5}s`;document.body.appendChild(e);setTimeout(()=>e.remove(),10500)}
document.querySelectorAll('.scene').forEach(s=>{[[4,10],[86,6],[8,44],[88,50],[5,80],[84,88]].forEach(p=>{const e=document.createElement('i');e.className='hs';e.textContent='❤️';e.style.cssText=`left:${p[0]+R()*5}%;top:${p[1]+R()*5}%;font-size:${16+R()*14}px;animation-delay:${-R()*2}s`;s.appendChild(e)})});
// cursor web trail
let lt=0;addEventListener('pointermove',e=>{const n=performance.now();if(n-lt<45)return;lt=n;const d=document.createElement('i');d.className='tr';d.style.left=e.clientX-3+'px';d.style.top=e.clientY-3+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),700)});
</script></body></html>
